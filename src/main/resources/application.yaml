spring:
  application:
    name: vcdm
  # H2 数据库配置（文件模式）
  datasource:
    url: jdbc:h2:file:./data/vcdm;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS PUBLIC
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    # 初始化数据库脚本
    initialization-mode: always
    schema: classpath:schema.sql
    data: classpath:data.sql
    # H2 控制台配置（开发环境可用，生产环境建议关闭）
    h2:
      console:
        enabled: true
        path: /h2-console
        settings:
          web-allow-others: false

server:
  port: 8080

# MyBatis 配置
mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径
  type-aliases-package: com.neonnexus.vcdm.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
