spring:
  datasource:
    url: jdbc:h2:file:./data/vcdm;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.neonnexus.vcdm.entity
  configuration:
    map-underscore-to-camel-case: true

snowflake:
  datacenter-id: 1
  worker-id: 1
